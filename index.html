<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halftone — 3D Visual Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --panel: rgba(20, 20, 22, 0.72);
    --panel-border: rgba(255, 255, 255, 0.06);
    --panel-hover: rgba(255, 255, 255, 0.04);
    --ink: #e8e8ea;
    --ink-dim: #8a8a92;
    --ink-faint: #4a4a52;
    --accent: #d9ff3f;
    --track: rgba(255, 255, 255, 0.08);
    --track-fill: rgba(255, 255, 255, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Top bar */
  .topbar {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  .topbar .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  .topbar strong { color: var(--ink); font-weight: 500; }

  /* Side panel */
  .panel {
    position: fixed; top: 18px; right: 18px; bottom: 18px;
    width: 296px;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 18px;
    overflow-y: auto;
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }

  .panel h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 18px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--panel-border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel h2:first-child { margin-top: 4px; }
  .panel h2 .badge {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--ink-faint);
  }

  /* Control row */
  .ctrl {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .ctrl label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .ctrl .val {
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--track);
    padding: 2px 8px;
    border-radius: 4px;
    min-width: 44px;
    text-align: right;
  }

  /* Slider */
  input[type=range] {
    grid-column: 1 / -1;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: var(--track);
    border-radius: 2px;
    outline: none;
    margin: 4px 0 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--ink);
    cursor: ew-resize;
    box-shadow: 0 0 0 1px var(--bg);
    transition: transform 0.12s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); cursor: ew-resize; border: none;
  }

  /* Segmented */
  .seg {
    grid-column: 1 / -1;
    display: flex;
    background: var(--track);
    border-radius: 6px;
    padding: 2px;
    margin-top: 4px;
  }
  .seg button {
    flex: 1;
    appearance: none; background: none; border: none;
    padding: 6px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.active {
    background: var(--ink);
    color: var(--bg);
  }

  /* Color picker row */
  .color-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .color-row label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .swatch-wrap {
    position: relative;
    width: 56px; height: 22px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
  }
  input[type=color] {
    position: absolute; inset: -2px;
    width: calc(100% + 4px); height: calc(100% + 4px);
    border: none; cursor: pointer; padding: 0;
    background: none;
  }

  /* Toggle button */
  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    background: var(--track);
    border: none;
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 8px;
    transition: background 0.15s;
  }
  .toggle:hover { background: var(--panel-hover); }
  .toggle .pill {
    width: 24px; height: 13px;
    background: var(--ink-faint);
    border-radius: 999px;
    position: relative;
    transition: background 0.2s;
  }
  .toggle .pill::after {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 9px; height: 9px;
    background: var(--bg);
    border-radius: 50%;
    transition: left 0.2s;
  }
  .toggle.on .pill { background: var(--accent); }
  .toggle.on .pill::after { left: 13px; }

  /* Action buttons */
  .action-btn {
    appearance: none;
    border: 1px solid var(--panel-border);
    background: var(--track);
    color: var(--ink-dim);
    padding: 9px 4px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .action-btn:hover { background: var(--panel-hover); color: var(--ink); border-color: var(--ink-faint); }

  .preset-row {
    display: flex; gap: 5px; margin-bottom: 8px;
  }
  .preset-row select { flex: 1; margin-bottom: 0; }
  .preset-row .action-btn { flex-shrink: 0; white-space: nowrap; }

  .preset-input {
    flex: 1; min-width: 0;
    background: var(--track);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    padding: 8px 10px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  .preset-input::placeholder { color: var(--ink-faint); }
  .preset-input:focus { border-color: var(--ink-faint); }
  .preset-input.error { border-color: rgba(255,80,80,0.6); }

  select {
    -webkit-appearance: none; appearance: none;
    width: 100%;
    background: var(--track);
    border: 1px solid var(--panel-border);
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 500;
    letter-spacing: 0.08em;
    padding: 8px 28px 8px 10px;
    border-radius: 6px;
    cursor: pointer; outline: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><polygon points='0,0 8,0 4,5' fill='%234a4a52'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    margin-bottom: 8px;
    transition: border-color 0.15s, color 0.15s;
  }
  select:hover { border-color: var(--ink-faint); color: var(--ink); }
  select option { background: #18181b; color: var(--ink); }

  /* Randomize */
  .rnd-row { display: flex; gap: 5px; margin-bottom: 4px; }
  .rnd-checks {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 10px;
    display: none;
  }
  .rnd-checks.open { display: block; }
  .rnd-group-label {
    font-size: 8px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--ink-faint);
    margin: 8px 0 4px;
  }
  .rnd-group-label:first-child { margin-top: 0; }
  .rnd-check-item {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0;
    font-size: 9px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-dim);
    cursor: pointer;
    user-select: none;
  }
  .rnd-check-item input[type=checkbox] {
    accent-color: var(--accent);
    width: 12px; height: 12px;
    cursor: pointer; flex-shrink: 0;
    margin: 0;
  }

  /* Hint footer */
  .hint {
    position: fixed; bottom: 18px; left: 18px;
    z-index: 10;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .hint kbd {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    background: var(--track);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    color: var(--ink-dim);
  }

  /* Palette gradient picker */
  .pal-swatches {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: 4px;
    margin-bottom: 4px;
  }
  .pal-btn {
    border: 1.5px solid transparent;
    border-radius: 6px;
    padding: 9px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .pal-btn.active {
    border-color: rgba(255,255,255,0.75);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>

  <div class="topbar">
    <span class="dot"></span>
    <span><strong>Halftone</strong> &nbsp;·&nbsp; 3d visual tool</span>
  </div>

  <div class="hint">
    <kbd>drag</kbd> rotate &nbsp;·&nbsp; <kbd>scroll</kbd> zoom
  </div>

  <aside class="panel">
    <!-- PRESETS -->
    <h2>Presets <span class="badge">config</span></h2>
    <div class="preset-row" style="margin-bottom:6px;">
      <input type="text" id="preset-name" class="preset-input" placeholder="preset name…" autocomplete="off" spellcheck="false">
      <button class="action-btn" id="btn-save-preset">Save</button>
    </div>
    <div class="preset-row">
      <select id="preset-select"><option value="">— select preset —</option></select>
      <button class="action-btn" id="btn-del-preset">Del</button>
    </div>
    <button class="action-btn" style="width:100%;margin-bottom:12px;" id="btn-reset-preset">Reset to defaults</button>

    <!-- GRID -->
    <h2>Grid <span class="badge">structure</span></h2>

    <div class="rnd-row">
      <button class="action-btn" style="flex:1;" id="btn-randomize">Randomize</button>
      <button class="action-btn" style="width:32px;" id="btn-rnd-toggle">▾</button>
    </div>
    <div class="rnd-checks" id="rnd-checks">
      <div class="rnd-group-label">Grid</div>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="mode" checked> Mode</label>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="density" checked> Density</label>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="cellW" checked> Cell Width</label>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="cellH" checked> Cell Height</label>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="round" checked> Roundness</label>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="rot" checked> Rotation</label>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="spacing" checked> Spacing</label>
      <div class="rnd-group-label">Brightness</div>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="brightness" checked> Low / Mid / High</label>
      <div class="rnd-group-label">Color</div>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="palPick" checked> Palette</label>
      <div class="rnd-group-label">Camera</div>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="fov" checked> FOV</label>
      <div class="rnd-group-label">Display</div>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="sizeFromBrt" checked> Size ← Brightness</label>
      <label class="rnd-check-item"><input type="checkbox" data-rnd="shading" checked> Shading</label>
    </div>

    <div class="ctrl">
      <label>Mode</label>
      <div class="seg" data-control="mode">
        <button data-val="dots">Cells</button>
        <button data-val="cols">Cols</button>
        <button data-val="rows" class="active">Rows</button>
      </div>
    </div>

    <div class="ctrl">
      <label>Density</label><span class="val" id="v-density">120</span>
      <input type="range" id="density" min="20" max="400" step="1" value="61">
    </div>

    <div class="ctrl">
      <label>Cell Width</label><span class="val" id="v-cellw">1.00</span>
      <input type="range" id="cellw" min="0.3" max="2.5" step="0.01" value="1.4">
    </div>

    <div class="ctrl">
      <label>Cell Height</label><span class="val" id="v-cellh">1.00</span>
      <input type="range" id="cellh" min="0.3" max="2.5" step="0.01" value="1.67">
    </div>

    <div class="ctrl">
      <label>Roundness</label><span class="val" id="v-round">1.00</span>
      <input type="range" id="round" min="0" max="1" step="0.01" value="1.0">
    </div>

    <div class="ctrl">
      <label>Rotation</label><span class="val" id="v-rot">0°</span>
      <input type="range" id="rot" min="-45" max="45" step="1" value="0">
    </div>

    <div class="ctrl">
      <label>Spacing</label><span class="val" id="v-spacing">0.00</span>
      <input type="range" id="spacing" min="0" max="0.9" step="0.01" value="0.19">
    </div>

    <!-- BRIGHTNESS -->
    <h2>Brightness <span class="badge">tone curve</span></h2>

    <div class="ctrl">
      <label>Low</label><span class="val" id="v-low">0.05</span>
      <input type="range" id="low" min="0" max="0.5" step="0.01" value="0.01">
    </div>

    <div class="ctrl">
      <label>Mid</label><span class="val" id="v-mid">0.50</span>
      <input type="range" id="mid" min="0.1" max="0.9" step="0.01" value="0.49">
    </div>

    <div class="ctrl">
      <label>High</label><span class="val" id="v-high">0.95</span>
      <input type="range" id="high" min="0.5" max="1" step="0.01" value="1.0">
    </div>

    <!-- COLOR -->
    <h2>Color <span class="badge">fill</span></h2>

    <div class="ctrl">
      <div class="seg" data-control="colormode" style="grid-column: 1 / -1;">
        <button data-val="solid">Solid</button>
        <button data-val="gradient">Grad</button>
        <button data-val="palrandom">Rand</button>
        <button data-val="palluma">Luma</button>
        <button data-val="palpick" class="active">Pick</button>
      </div>
    </div>

    <div id="solid-controls" style="display:none;">
      <div class="color-row">
        <label>Fill</label>
        <div class="swatch-wrap"><input type="color" id="solid-color" value="#a8ff0a"></div>
      </div>
    </div>

    <div id="palette-pick-controls" style="margin-bottom:8px;">
      <div style="font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;">Palette</div>
      <div class="pal-swatches" data-control="palPick">
        <button class="pal-btn" data-val="0" style="background:linear-gradient(135deg,#645139,#5ca6cd)">Surface</button>
        <button class="pal-btn active" data-val="1" style="background:linear-gradient(135deg,#e44d43,#f9cf80)">Sunset</button>
        <button class="pal-btn" data-val="2" style="background:linear-gradient(135deg,#4e5d02,#a0b80a)">Forest</button>
        <button class="pal-btn" data-val="3" style="background:linear-gradient(135deg,#cf2f1e,#e18ea3)">Bloom</button>
      </div>
    </div>

    <div id="gradient-controls" style="display:none;">
      <div class="color-row">
        <label>Low</label>
        <div class="swatch-wrap"><input type="color" id="grad-low" value="#1a3300"></div>
      </div>
      <div class="color-row">
        <label>Mid</label>
        <div class="swatch-wrap"><input type="color" id="grad-mid" value="#86d900"></div>
      </div>
      <div class="color-row">
        <label>High</label>
        <div class="swatch-wrap"><input type="color" id="grad-high" value="#eeffba"></div>
      </div>
    </div>

    <div class="color-row" style="margin-top:6px;">
      <label>Background</label>
      <div class="swatch-wrap"><input type="color" id="bg-color" value="#f5f1ea"></div>
    </div>

    <!-- OBJECT -->
    <h2>Object <span class="badge">3d source</span></h2>

    <div class="ctrl">
      <label>Source</label>
      <div class="seg" data-control="source">
        <button data-val="model" class="active">Model</button>
        <button data-val="text">Text</button>
      </div>
    </div>

    <div id="text-controls" style="display:none;">
      <select id="font-select" style="margin-bottom:8px;">
        <option value="helvetiker_bold">Helvetiker Bold</option>
        <option value="helvetiker_regular">Helvetiker Regular</option>
        <option value="gentilis_bold">Gentilis Bold</option>
        <option value="gentilis_regular">Gentilis Regular</option>
        <option value="optimer_bold">Optimer Bold</option>
        <option value="droid_serif_regular">Droid Serif</option>
      </select>
      <div style="margin-bottom:8px;">
        <input type="text" id="text-input" value="HALFTONE"
          style="width:100%;background:var(--track);border:1px solid var(--panel-border);
                 color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:11px;
                 letter-spacing:0.08em;padding:8px 10px;border-radius:6px;outline:none;
                 text-transform:uppercase;" autocomplete="off" spellcheck="false">
      </div>
      <div class="ctrl">
        <label>Depth</label><span class="val" id="v-textdepth">0.30</span>
        <input type="range" id="textdepth" min="0.01" max="1.5" step="0.01" value="0.3">
      </div>
      <div class="ctrl">
        <label>Bevel</label><span class="val" id="v-textbevel">0.04</span>
        <input type="range" id="textbevel" min="0" max="0.2" step="0.005" value="0.04">
      </div>
    </div>

    <div class="ctrl">
      <label>FOV</label><span class="val" id="v-fov">35°</span>
      <input type="range" id="fov" min="10" max="90" step="1" value="10">
    </div>

    <div class="ctrl">
      <label>Shading</label>
      <div class="seg" data-control="shading">
        <button data-val="flat">Silhouette</button>
        <button data-val="lit" class="active">Lit</button>
      </div>
    </div>

    <button class="toggle" id="toggle-size-brt">
      Size ← Brightness <span class="pill"></span>
    </button>

    <button class="toggle on" id="toggle-spin">
      Auto-spin <span class="pill"></span>
    </button>

    <div class="ctrl">
      <label>Spin Speed</label><span class="val" id="v-spin">0.30</span>
      <input type="range" id="spin" min="0" max="2" step="0.01" value="0.3">
    </div>

    <!-- LIGHTING -->
    <h2>Lighting <span class="badge">key light</span></h2>

    <div class="ctrl">
      <label>Azimuth</label><span class="val" id="v-lightaz">30°</span>
      <input type="range" id="lightaz" min="-180" max="180" step="1" value="30">
    </div>
    <div class="ctrl">
      <label>Elevation</label><span class="val" id="v-lightel">45°</span>
      <input type="range" id="lightel" min="-30" max="90" step="1" value="45">
    </div>
    <div class="ctrl">
      <label>Key Int</label><span class="val" id="v-lightkeyint">1.20</span>
      <input type="range" id="lightkeyint" min="0" max="3" step="0.05" value="1.2">
    </div>
    <div class="ctrl">
      <label>Amb Int</label><span class="val" id="v-lightambint">0.40</span>
      <input type="range" id="lightambint" min="0" max="2" step="0.05" value="0.4">
    </div>
  </aside>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ============================================================
// STATE — single source of truth, wired to UI
// ============================================================
const state = {
  mode: 2,            // 0=cells, 1=cols, 2=rows
  density: 61,
  cellW: 1.4,
  cellH: 1.67,
  round: 1.0,
  rot: 0,
  spacing: 0.19,
  fov: 10,
  sizeFromBrt: false,
  low: 0.01,
  mid: 0.49,
  high: 1.0,
  colorMode: 4,       // 0=solid, 1=gradient, 2=palrandom, 3=palluma, 4=palpick
  solid: [0.66, 1.0, 0.04],
  gLow:  [0.10, 0.20, 0.0],
  gMid:  [0.53, 0.85, 0.0],
  gHigh: [0.93, 1.0, 0.73],
  bg:    [0.961, 0.945, 0.918],
  shading: 1,         // 0=flat, 1=lit
  spinOn: true,
  spinSpeed: 0.3,
  palPick: 1,
  source: 'model',    // 'model' | 'text'
  textContent: 'HALFTONE',
  textDepth: 0.3,
  textBevel: 0.04,
  fontKey: 'helvetiker_bold',
  lightAzimuth: 30,
  lightElevation: 45,
  lightKeyInt: 1.2,
  lightAmbInt: 0.4,
};

// ============================================================
// THREE.JS SETUP
// ============================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
camera.position.set(0, 0, 200);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 50;
controls.maxDistance = 1000;
controls.target.set(0, 0, 0);

// Lighting — parented to camera so they stay fixed relative to the view
// (model spins / user orbits without changing apparent illumination)
scene.add(camera);
const ambient  = new THREE.AmbientLight(0xffffff, 0.4);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(-3, 1, 3);
const keyTarget = new THREE.Object3D();
keyTarget.position.set(0, 0, -10); // points into the scene (camera -Z)
camera.add(ambient, keyLight, rimLight, keyTarget);
keyLight.target = keyTarget;

function updateKeyLight() {
  const az = state.lightAzimuth * Math.PI / 180;
  const el = state.lightElevation * Math.PI / 180;
  keyLight.position.set(
    Math.sin(az) * 5,
    Math.sin(el) * 5,
    Math.cos(el) * Math.cos(az) * 5  // +Z = behind camera → illuminates front of model
  );
  keyLight.intensity    = state.lightKeyInt;
  ambient.intensity     = state.lightAmbInt;
}

// Model group — lets us spin without affecting camera target
const modelGroup = new THREE.Group();
scene.add(modelGroup);

// Text group
const textGroup = new THREE.Group();
textGroup.visible = false;
scene.add(textGroup);

let loadedFont = null;
let textMesh = null;
let textRebuildTimer = null;

const FONT_URLS = {
  helvetiker_bold:     'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  helvetiker_regular:  'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json',
  gentilis_bold:       'https://unpkg.com/three@0.160.0/examples/fonts/gentilis_bold.typeface.json',
  gentilis_regular:    'https://unpkg.com/three@0.160.0/examples/fonts/gentilis_regular.typeface.json',
  optimer_bold:        'https://unpkg.com/three@0.160.0/examples/fonts/optimer_bold.typeface.json',
  droid_serif_regular: 'https://unpkg.com/three@0.160.0/examples/fonts/droid/droid_serif_regular.typeface.json',
};
const fontCache = {};

function loadFont(key, cb) {
  if (fontCache[key]) { cb(fontCache[key]); return; }
  new FontLoader().load(FONT_URLS[key], font => { fontCache[key] = font; cb(font); });
}

// Load default font on startup
loadFont(state.fontKey, font => { loadedFont = font; if (state.source === 'text') buildText(true); });

function buildText(reframe = false) {
  if (!loadedFont) return;
  if (textMesh) { textGroup.remove(textMesh); textMesh.geometry.dispose(); textMesh = null; }

  const geo = new TextGeometry(state.textContent || ' ', {
    font: loadedFont,
    size: 10,
    depth: Math.max(state.textDepth * 10, 0.1),
    curveSegments: 8,
    bevelEnabled: state.textBevel > 0,
    bevelThickness: state.textBevel * 10,
    bevelSize: state.textBevel * 5,
    bevelSegments: 4,
  });
  geo.computeBoundingBox();
  geo.center();

  const mat = state.shading === 0 ? flatMaterial : litMaterial;
  textMesh = new THREE.Mesh(geo, mat);
  textGroup.add(textMesh);
  if (reframe) frameText();
}

function frameText() {
  if (!textMesh) return;
  const box = new THREE.Box3().setFromObject(textGroup);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  const dist = (maxDim * 0.6) / Math.tan(fov / 2);
  camera.position.set(0, 0, dist * 1.4);
  controls.target.set(0, 0, 0);
  controls.update();
}

function setSource(src) {
  state.source = src;
  modelGroup.visible = src === 'model';
  textGroup.visible  = src === 'text';
  document.getElementById('text-controls').style.display = src === 'text' ? '' : 'none';
  if (src === 'text') buildText(true);
}

// Two materials: flat (silhouette) and lit. We swap on all loaded meshes.
const flatMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
const litMaterial  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.0 });

let loadedRoot = null;
const meshObjects = [];

new GLTFLoader().load(
  './model.gltf',
  (gltf) => {
    const root = gltf.scene;
    root.traverse((obj) => {
      if (obj.isMesh) {
        obj.material = state.shading === 0 ? flatMaterial : litMaterial;
        meshObjects.push(obj);
      } else if (obj.isLine || obj.isLineSegments || obj.isLineLoop) {
        obj.visible = false;
      }
    });
    if (meshObjects.length) {
      modelGroup.add(root);
      loadedRoot = root;
      frameModel();
    }
  },
  undefined,
  (err) => console.error('GLTF load error', err)
);

function frameModel() {
  if (!loadedRoot) return;
  const box = new THREE.Box3().setFromObject(modelGroup);
  const size   = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  loadedRoot.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov    = camera.fov * (Math.PI / 180);
  const dist   = (maxDim * 0.6) / Math.tan(fov / 2);
  camera.position.set(0, 0, dist * 1.25);
  controls.target.set(0, 0, 0);
  controls.update();
}

// ============================================================
// RENDER TARGET — NearestFilter avoids edge-blending artefacts
// ============================================================
const sceneTarget = new THREE.WebGLRenderTarget(2, 2, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  type: THREE.UnsignedByteType,
});

// ============================================================
// HALFTONE PASS
// ============================================================
const quadScene = new THREE.Scene();
const quadCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const halftoneMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTex:         { value: sceneTarget.texture },
    uResolution:  { value: new THREE.Vector2(1, 1) },
    uMode:        { value: 0 },
    uDensity:     { value: 120.0 },
    uCellW:       { value: 1.0 },
    uCellH:       { value: 1.0 },
    uRound:       { value: 1.0 },
    uRot:         { value: 0.0 },
    uLow:         { value: 0.05 },
    uMid:         { value: 0.5 },
    uHigh:        { value: 0.95 },
    uSpacing:     { value: 0.0 },
    uSizeFromBrt: { value: 1 },
    uColorMode:   { value: 0 },
    uSolid:       { value: new THREE.Vector3(0.66, 1.0, 0.04) },
    uGLow:        { value: new THREE.Vector3(0.10, 0.20, 0.0) },
    uGMid:        { value: new THREE.Vector3(0.53, 0.85, 0.0) },
    uGHigh:       { value: new THREE.Vector3(0.93, 1.0, 0.73) },
    uBg:          { value: new THREE.Vector3(0, 0, 0) },
    uPal0A:       { value: new THREE.Vector3(0.392, 0.318, 0.224) },
    uPal0B:       { value: new THREE.Vector3(0.361, 0.651, 0.804) },
    uPal1A:       { value: new THREE.Vector3(0.894, 0.302, 0.263) },
    uPal1B:       { value: new THREE.Vector3(0.976, 0.812, 0.502) },
    uPal2A:       { value: new THREE.Vector3(0.306, 0.365, 0.008) },
    uPal2B:       { value: new THREE.Vector3(0.627, 0.722, 0.039) },
    uPal3A:       { value: new THREE.Vector3(0.812, 0.184, 0.118) },
    uPal3B:       { value: new THREE.Vector3(0.882, 0.557, 0.639) },
    uPalPick:     { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform vec2 uResolution;

    uniform int   uMode;
    uniform float uDensity;
    uniform float uCellW;
    uniform float uCellH;
    uniform float uRound;
    uniform float uRot;

    uniform float uLow;
    uniform float uMid;
    uniform float uHigh;

    uniform float uSpacing;
    uniform int   uSizeFromBrt;

    uniform int   uColorMode;
    uniform vec3  uSolid;
    uniform vec3  uGLow;
    uniform vec3  uGMid;
    uniform vec3  uGHigh;
    uniform vec3  uBg;

    uniform vec3  uPal0A; uniform vec3 uPal0B;
    uniform vec3  uPal1A; uniform vec3 uPal1B;
    uniform vec3  uPal2A; uniform vec3 uPal2B;
    uniform vec3  uPal3A; uniform vec3 uPal3B;
    uniform int   uPalPick;

    float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

    float toneCurve(float l) {
      l = clamp(l, 0.0, 1.0);
      if (l <= uLow)  return 0.0;
      if (l >= uHigh) return 1.0;
      if (l < uMid) return (l - uLow) / max(uMid - uLow, 1e-4) * 0.5;
      return 0.5 + (l - uMid) / max(uHigh - uMid, 1e-4) * 0.5;
    }

    vec3 sampleGradient(float t) {
      t = clamp(t, 0.0, 1.0);
      if (t < 0.5) return mix(uGLow, uGMid, t * 2.0);
      return mix(uGMid, uGHigh, (t - 0.5) * 2.0);
    }

    vec3 palColor(int gi, float t) {
      t = clamp(t, 0.0, 1.0);
      if (gi == 0) return mix(uPal0A, uPal0B, t);
      if (gi == 1) return mix(uPal1A, uPal1B, t);
      if (gi == 2) return mix(uPal2A, uPal2B, t);
      return mix(uPal3A, uPal3B, t);
    }

    // Signed-distance rounded box centred at origin; hext = half-extents
    float sdRoundBox(vec2 p, vec2 hext, float r) {
      r = min(r, min(hext.x, hext.y));
      vec2 q = abs(p) - (hext - vec2(r));
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
    }

    void main() {
      // Grid in pixel space, with optional rotation
      vec2 pix    = vUv * uResolution;
      vec2 center = uResolution * 0.5;
      vec2 p      = pix - center;
      float c = cos(uRot), s = sin(uRot);
      p = mat2(c, -s, s, c) * p;
      p += center;

      float baseCell = min(uResolution.x, uResolution.y) / uDensity;
      vec2 cellSize  = vec2(baseCell * uCellW, baseCell * uCellH);

      vec2 cellIdx      = floor(p / cellSize);
      vec2 cellCenterPix = (cellIdx + 0.5) * cellSize;

      // Rotate cell centre back to sample the texture
      vec2 q2    = cellCenterPix - center;
      vec2 qBack = mat2(c, s, -s, c) * q2;
      vec2 sampleUv = (qBack + center) / uResolution;

      vec3 bg = uBg;
      if (sampleUv.x < 0.0 || sampleUv.x > 1.0 ||
          sampleUv.y < 0.0 || sampleUv.y > 1.0) {
        gl_FragColor = vec4(bg, 1.0); return;
      }

      vec4  tex = texture2D(uTex, sampleUv);
      float l   = luma(tex.rgb) * tex.a;   // alpha=0 outside model → l=0
      float t   = toneCurve(l);

      // Early-exit: avoids SDF-centre artefact (mask=0.5) at t≈0
      if (t < 0.01) { gl_FragColor = vec4(bg, 1.0); return; }

      // Decouple size from colour: when off, every cell is drawn at full size
      float tSize = (uSizeFromBrt == 1) ? t : 1.0;

      vec2  local = p - cellCenterPix;
      float gap   = 1.0 - uSpacing;

      // Palette gradient direction: within-cell for CELLS, screen-space for COLS/ROWS
      float cellLocalT;
      if (uMode == 0) {
        vec2 hF = cellSize * 0.5 * gap * tSize;
        cellLocalT = clamp(local.y / max(hF.y, 0.001) * 0.5 + 0.5, 0.0, 1.0);
      } else if (uMode == 1) {
        cellLocalT = clamp(pix.y / uResolution.y, 0.0, 1.0);
      } else {
        cellLocalT = clamp(pix.x / uResolution.x, 0.0, 1.0);
      }

      float mask  = 0.0;

      if (uMode == 0) {
        // CELLS — both axes scale with brightness
        vec2  hext = cellSize * 0.5 * gap * tSize;
        float r    = uRound * min(hext.x, hext.y);
        float d    = sdRoundBox(local, hext, r);
        float aa   = max(fwidth(d), 0.5);
        mask = 1.0 - smoothstep(-aa, aa, d);
      } else if (uMode == 1) {
        // COLS — continuous vertical bars; only X is clipped, width scales with brightness
        float hw = cellSize.x * 0.5 * gap * tSize;
        float d  = abs(local.x) - hw;
        float aa = max(fwidth(d), 0.5);
        mask = 1.0 - smoothstep(-aa, aa, d);
      } else {
        // ROWS — continuous horizontal bars; only Y is clipped, height scales with brightness
        float hh = cellSize.y * 0.5 * gap * tSize;
        float d  = abs(local.y) - hh;
        float aa = max(fwidth(d), 0.5);
        mask = 1.0 - smoothstep(-aa, aa, d);
      }

      vec3 fillColor;
      if (uColorMode == 0) {
        fillColor = uSolid;
      } else if (uColorMode == 1) {
        fillColor = sampleGradient(t);
      } else if (uColorMode == 2) {
        // Random gradient per cell (stable hash)
        float hh = fract(sin(dot(cellIdx, vec2(127.1, 311.7))) * 43758.5453);
        int gi = int(min(floor(hh * 4.0), 3.0));
        fillColor = palColor(gi, cellLocalT);
      } else if (uColorMode == 3) {
        // Gradient chosen by brightness, fill spans cell
        int gi = int(min(floor(t * 4.0), 3.0));
        fillColor = palColor(gi, cellLocalT);
      } else {
        // Solid color sampled from user-picked gradient via brightness
        fillColor = palColor(uPalPick, t);
      }
      gl_FragColor = vec4(mix(bg, fillColor, mask), 1.0);
    }
  `,
});

quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), halftoneMaterial));

// ============================================================
// RESIZE
// ============================================================
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = renderer.getPixelRatio();
  renderer.setSize(w, h, false);
  sceneTarget.setSize(Math.floor(w * dpr), Math.floor(h * dpr));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  halftoneMaterial.uniforms.uResolution.value.set(Math.floor(w * dpr), Math.floor(h * dpr));
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// MAIN LOOP
// ============================================================
const clock = new THREE.Clock();

function render() {
  const dt = clock.getDelta();

  if (state.spinOn && loadedRoot) modelGroup.rotation.y += dt * state.spinSpeed;
  controls.update();

  // Pass 1 — render 3D scene to offscreen target (transparent clear → alpha masks background)
  renderer.setRenderTarget(sceneTarget);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, camera);

  // Pass 2 — halftone quad → screen
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCam);

  requestAnimationFrame(render);
}
render();

// ============================================================
// UI WIRING
// ============================================================
function hexToRgb(hex) {
  const m = hex.replace('#', '');
  return [parseInt(m.slice(0,2),16)/255, parseInt(m.slice(2,4),16)/255, parseInt(m.slice(4,6),16)/255];
}

function syncUniforms() {
  const u = halftoneMaterial.uniforms;
  u.uMode.value        = state.mode;
  u.uDensity.value     = state.density;
  u.uCellW.value       = state.cellW;
  u.uCellH.value       = state.cellH;
  u.uRound.value       = state.round;
  u.uRot.value         = state.rot * Math.PI / 180;
  u.uSpacing.value     = state.spacing;
  u.uSizeFromBrt.value = state.sizeFromBrt ? 1 : 0;
  u.uLow.value         = state.low;
  u.uMid.value         = state.mid;
  u.uHigh.value        = state.high;
  u.uColorMode.value   = state.colorMode;
  u.uSolid.value.fromArray(state.solid);
  u.uGLow.value.fromArray(state.gLow);
  u.uGMid.value.fromArray(state.gMid);
  u.uGHigh.value.fromArray(state.gHigh);
  u.uBg.value.fromArray(state.bg);
  u.uPalPick.value = state.palPick;
}

function bindSlider(id, key, fmt = v => v.toFixed(2), parse = parseFloat, valKey = id) {
  const el  = document.getElementById(id);
  const val = document.getElementById('v-' + valKey);
  const apply = () => {
    state[key] = parse(el.value);
    if (val) val.textContent = fmt(state[key]);
    syncUniforms();
  };
  el.addEventListener('input', apply);
  apply();
}

function bindSegmented(name, key, parse = v => v) {
  const wrap = document.querySelector(`.seg[data-control="${name}"]`);
  if (!wrap) return;
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    wrap.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state[key] = parse(btn.dataset.val);
    if (key === 'colorMode') {
      document.getElementById('solid-controls').style.display        = state.colorMode === 0 ? '' : 'none';
      document.getElementById('gradient-controls').style.display     = state.colorMode === 1 ? '' : 'none';
      document.getElementById('palette-pick-controls').style.display = state.colorMode === 4 ? '' : 'none';
    }
    if (key === 'shading') {
      const mat = state.shading === 0 ? flatMaterial : litMaterial;
      meshObjects.forEach(m => { m.material = mat; });
      if (textMesh) textMesh.material = mat;
    }
    syncUniforms();
  });
}

function bindColor(id, key) {
  const el = document.getElementById(id);
  const apply = () => { state[key] = hexToRgb(el.value); syncUniforms(); };
  el.addEventListener('input', apply);
  apply();
}

// Sliders
bindSlider('density', 'density', v => v.toFixed(0), parseFloat, 'density');
bindSlider('cellw',   'cellW',   v => v.toFixed(2), parseFloat, 'cellw');
bindSlider('cellh',   'cellH',   v => v.toFixed(2), parseFloat, 'cellh');
bindSlider('round',   'round',   v => v.toFixed(2), parseFloat, 'round');
bindSlider('rot',     'rot',     v => v.toFixed(0) + '°', parseFloat, 'rot');
bindSlider('spacing', 'spacing', v => v.toFixed(2), parseFloat, 'spacing');
bindSlider('low',     'low',     v => v.toFixed(2), parseFloat, 'low');
bindSlider('mid',     'mid',     v => v.toFixed(2), parseFloat, 'mid');
bindSlider('high',    'high',    v => v.toFixed(2), parseFloat, 'high');
bindSlider('spin',    'spinSpeed', v => v.toFixed(2), parseFloat, 'spin');

// Segmented
bindSegmented('mode',      'mode',      v => ({ dots: 0, cols: 1, rows: 2 }[v]));
bindSegmented('colormode', 'colorMode', v => ({ solid: 0, gradient: 1, palrandom: 2, palluma: 3, palpick: 4 }[v]));
bindSegmented('shading',   'shading',   v => ({ flat: 0, lit: 1 }[v]));

// Colors
bindColor('solid-color', 'solid');
bindColor('grad-low',    'gLow');
bindColor('grad-mid',    'gMid');
bindColor('grad-high',   'gHigh');
bindColor('bg-color',    'bg');

// FOV
(function() {
  const el = document.getElementById('fov'), val = document.getElementById('v-fov');
  el.addEventListener('input', () => {
    state.fov = parseFloat(el.value);
    val.textContent = state.fov.toFixed(0) + '°';
    camera.fov = state.fov;
    camera.updateProjectionMatrix();
  });
  val.textContent = state.fov.toFixed(0) + '°';
})();

// Size ← Brightness toggle
const sizeBrtBtn = document.getElementById('toggle-size-brt');
sizeBrtBtn.addEventListener('click', () => {
  state.sizeFromBrt = !state.sizeFromBrt;
  sizeBrtBtn.classList.toggle('on', state.sizeFromBrt);
  syncUniforms();
});

// Auto-spin toggle
const spinBtn = document.getElementById('toggle-spin');
spinBtn.addEventListener('click', () => {
  state.spinOn = !state.spinOn;
  spinBtn.classList.toggle('on', state.spinOn);
});

// ============================================================
// DEFAULTS & PRESETS
// ============================================================
const DEFAULTS = {
  mode: 2, density: 61, cellW: 1.4, cellH: 1.67, round: 1.0, rot: 0, spacing: 0.19,
  fov: 10, sizeFromBrt: false,
  low: 0.01, mid: 0.49, high: 1.0,
  colorMode: 4,
  solid:  [0.66, 1.0, 0.04],
  gLow:   [0.10, 0.20, 0.0],
  gMid:   [0.53, 0.85, 0.0],
  gHigh:  [0.93, 1.0, 0.73],
  bg:     [0.961, 0.945, 0.918],
  shading: 1, spinOn: true, spinSpeed: 0.3, palPick: 1,
  source: 'model', textContent: 'HALFTONE', textDepth: 0.3, textBevel: 0.04,
  fontKey: 'helvetiker_bold',
  lightAzimuth: 30, lightElevation: 45, lightKeyInt: 1.2, lightAmbInt: 0.4,

const PRESET_KEYS = [
  'mode','density','cellW','cellH','round','rot','spacing',
  'fov','sizeFromBrt','low','mid','high',
  'colorMode','solid','gLow','gMid','gHigh','bg','palPick',
  'shading','spinOn','spinSpeed',
  'source','textContent','textDepth','textBevel','fontKey',
  'lightAzimuth','lightElevation','lightKeyInt','lightAmbInt',
];

function loadPresetList() {
  const presets = JSON.parse(localStorage.getItem('halftone-tool-presets') || '{}');
  const sel = document.getElementById('preset-select');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— select preset —</option>';
  Object.keys(presets).sort().forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n; sel.appendChild(o);
  });
  if (presets[cur]) sel.value = cur;
  return presets;
}

function applyPreset(settings) {
  PRESET_KEYS.forEach(k => {
    if (settings[k] !== undefined) state[k] = JSON.parse(JSON.stringify(settings[k]));
  });
  // Apply source switch
  setSource(state.source);
  // Sync camera
  camera.fov = state.fov;
  camera.updateProjectionMatrix();
  // Sync shading
  const mat = state.shading === 0 ? flatMaterial : litMaterial;
  meshObjects.forEach(m => { m.material = mat; });
  if (textMesh) textMesh.material = mat;
  // Sync toggles
  document.getElementById('toggle-size-brt').classList.toggle('on', state.sizeFromBrt);
  document.getElementById('toggle-spin').classList.toggle('on', state.spinOn);
  document.querySelector('.seg[data-control="shading"] button[data-val="flat"]').classList.toggle('active', state.shading === 0);
  document.querySelector('.seg[data-control="shading"] button[data-val="lit"]').classList.toggle('active', state.shading === 1);
  document.querySelector('.seg[data-control="source"] button[data-val="model"]').classList.toggle('active', state.source === 'model');
  document.querySelector('.seg[data-control="source"] button[data-val="text"]').classList.toggle('active', state.source === 'text');
  // Sync sliders
  [['density','density'],['cellw','cellW'],['cellh','cellH'],['round','round'],['rot','rot'],
   ['spacing','spacing'],['low','low'],['mid','mid'],['high','high'],
   ['fov','fov'],['spin','spinSpeed'],['textdepth','textDepth'],['textbevel','textBevel']
  ].forEach(([id, key]) => {
    const el = document.getElementById(id); if (el) el.value = state[key];
  });
  document.getElementById('v-density').textContent = state.density.toFixed(0);
  document.getElementById('v-cellw').textContent   = state.cellW.toFixed(2);
  document.getElementById('v-cellh').textContent   = state.cellH.toFixed(2);
  document.getElementById('v-round').textContent   = state.round.toFixed(2);
  document.getElementById('v-rot').textContent     = state.rot.toFixed(0) + '°';
  document.getElementById('v-spacing').textContent = state.spacing.toFixed(2);
  document.getElementById('v-low').textContent     = state.low.toFixed(2);
  document.getElementById('v-mid').textContent     = state.mid.toFixed(2);
  document.getElementById('v-high').textContent    = state.high.toFixed(2);
  document.getElementById('v-fov').textContent     = state.fov.toFixed(0) + '°';
  document.getElementById('v-spin').textContent    = state.spinSpeed.toFixed(2);
  if (document.getElementById('v-textdepth')) document.getElementById('v-textdepth').textContent = state.textDepth.toFixed(2);
  if (document.getElementById('v-textbevel')) document.getElementById('v-textbevel').textContent = state.textBevel.toFixed(2);
  // Mode seg
  ['dots','cols','rows'].forEach((v,i) => {
    document.querySelector(`.seg[data-control="mode"] button[data-val="${v}"]`).classList.toggle('active', state.mode === i);
  });
  // Color mode seg + visibility
  const cmMap = {0:'solid',1:'gradient',2:'palrandom',3:'palluma',4:'palpick'};
  document.querySelectorAll('.seg[data-control="colormode"] button').forEach(b => {
    b.classList.toggle('active', b.dataset.val === cmMap[state.colorMode]);
  });
  document.getElementById('solid-controls').style.display        = state.colorMode === 0 ? '' : 'none';
  document.getElementById('gradient-controls').style.display     = state.colorMode === 1 ? '' : 'none';
  document.getElementById('palette-pick-controls').style.display = state.colorMode === 4 ? '' : 'none';
  // Palette pick
  document.querySelectorAll('.pal-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) === state.palPick));
  // Text input & font
  document.getElementById('text-input').value = state.textContent;
  const fs = document.getElementById('font-select');
  if (fs) fs.value = state.fontKey;
  // Light sliders
  [['lightaz','lightAzimuth'],['lightel','lightElevation'],
   ['lightkeyint','lightKeyInt'],['lightambint','lightAmbInt']].forEach(([id,key]) => {
    const el = document.getElementById(id); if (el) el.value = state[key];
  });
  document.getElementById('v-lightaz').textContent     = state.lightAzimuth.toFixed(0) + '°';
  document.getElementById('v-lightel').textContent     = state.lightElevation.toFixed(0) + '°';
  document.getElementById('v-lightkeyint').textContent = state.lightKeyInt.toFixed(2);
  document.getElementById('v-lightambint').textContent = state.lightAmbInt.toFixed(2);
  updateKeyLight();
  syncUniforms();
}

document.getElementById('preset-select').addEventListener('change', function() {
  if (!this.value) return;
  const presets = JSON.parse(localStorage.getItem('halftone-tool-presets') || '{}');
  if (presets[this.value]) applyPreset(presets[this.value]);
});

document.getElementById('btn-save-preset').addEventListener('click', () => {
  const input = document.getElementById('preset-name');
  const n = input.value.trim();
  if (!n) { input.classList.add('error'); input.focus(); setTimeout(() => input.classList.remove('error'), 700); return; }
  const presets = JSON.parse(localStorage.getItem('halftone-tool-presets') || '{}');
  const snap = {};
  PRESET_KEYS.forEach(k => { snap[k] = JSON.parse(JSON.stringify(state[k])); });
  presets[n] = snap;
  localStorage.setItem('halftone-tool-presets', JSON.stringify(presets));
  loadPresetList();
  document.getElementById('preset-select').value = n;
  input.value = '';
});

document.getElementById('btn-del-preset').addEventListener('click', () => {
  const sel = document.getElementById('preset-select');
  if (!sel.value) return;
  const presets = JSON.parse(localStorage.getItem('halftone-tool-presets') || '{}');
  delete presets[sel.value];
  localStorage.setItem('halftone-tool-presets', JSON.stringify(presets));
  loadPresetList();
});

document.getElementById('btn-reset-preset').addEventListener('click', () => applyPreset(DEFAULTS));

// RANDOMIZE

document.getElementById('btn-rnd-toggle').addEventListener('click', () => {
  document.getElementById('rnd-checks').classList.toggle('open');
});

function isChecked(key) {
  const el = document.querySelector(`input[data-rnd="${key}"]`);
  return el ? el.checked : true;
}

function randomize() {
  const rnd  = (a, b) => a + Math.random() * (b - a);
  const rndI = (a, b) => Math.floor(a + Math.random() * (b - a + 1));

  if (isChecked('mode'))      { state.mode = rndI(0, 2); }
  if (isChecked('density'))   { state.density = rndI(20, 180); }
  if (isChecked('cellW'))     { state.cellW = parseFloat(rnd(0.3, 2.5).toFixed(2)); }
  if (isChecked('cellH'))     { state.cellH = parseFloat(rnd(0.3, 2.5).toFixed(2)); }
  if (isChecked('round'))     { state.round = parseFloat(rnd(0, 1).toFixed(2)); }
  if (isChecked('rot'))       { state.rot = rndI(-45, 45); }
  if (isChecked('spacing'))   { state.spacing = parseFloat(rnd(0, 0.55).toFixed(2)); }
  if (isChecked('brightness')) {
    const lo = parseFloat(rnd(0, 0.2).toFixed(2));
    const hi = parseFloat(rnd(0.7, 1.0).toFixed(2));
    state.low  = lo;
    state.mid  = parseFloat(((lo + hi) / 2 + rnd(-0.1, 0.1)).toFixed(2));
    state.high = hi;
  }
  if (isChecked('palPick'))   { state.palPick = rndI(0, 3); }
  if (isChecked('fov'))       { state.fov = rndI(10, 60); camera.fov = state.fov; camera.updateProjectionMatrix(); }
  if (isChecked('sizeFromBrt')) { state.sizeFromBrt = Math.random() > 0.5; document.getElementById('toggle-size-brt').classList.toggle('on', state.sizeFromBrt); }
  if (isChecked('shading'))   {
    state.shading = rndI(0, 1);
    const mat = state.shading === 0 ? flatMaterial : litMaterial;
    meshObjects.forEach(m => { m.material = mat; });
    if (textMesh) textMesh.material = mat;
    document.querySelector('.seg[data-control="shading"] button[data-val="flat"]').classList.toggle('active', state.shading === 0);
    document.querySelector('.seg[data-control="shading"] button[data-val="lit"]').classList.toggle('active', state.shading === 1);
  }

  applyPreset(state); // re-sync all UI from state
}

document.getElementById('btn-randomize').addEventListener('click', randomize);

// Light sliders
(function() {
  function bindLight(id, key, fmt) {
    const el = document.getElementById(id), val = document.getElementById('v-' + id);
    el.addEventListener('input', () => {
      state[key] = parseFloat(el.value);
      val.textContent = fmt(state[key]);
      updateKeyLight();
    });
  }
  bindLight('lightaz',     'lightAzimuth',  v => v.toFixed(0) + '°');
  bindLight('lightel',     'lightElevation',v => v.toFixed(0) + '°');
  bindLight('lightkeyint', 'lightKeyInt',   v => v.toFixed(2));
  bindLight('lightambint', 'lightAmbInt',   v => v.toFixed(2));
  updateKeyLight();
})();

document.getElementById('text-input').addEventListener('input', function() {
  state.textContent = this.value || ' ';

  textRebuildTimer = setTimeout(buildText, 300);
});

    state.textBevel = parseFloat(bevelEl.value);
