<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halftone — 3D Visual Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --panel: rgba(20, 20, 22, 0.72);
    --panel-border: rgba(255, 255, 255, 0.06);
    --panel-hover: rgba(255, 255, 255, 0.04);
    --ink: #e8e8ea;
    --ink-dim: #8a8a92;
    --ink-faint: #4a4a52;
    --accent: #d9ff3f;
    --track: rgba(255, 255, 255, 0.08);
    --track-fill: rgba(255, 255, 255, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Top bar */
  .topbar {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  .topbar .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  .topbar strong { color: var(--ink); font-weight: 500; }

  /* Side panel */
  .panel {
    position: fixed; top: 18px; right: 18px; bottom: 18px;
    width: 296px;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 18px;
    overflow-y: auto;
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }

  .panel h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 18px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--panel-border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel h2:first-child { margin-top: 4px; }
  .panel h2 .badge {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--ink-faint);
  }

  /* Control row */
  .ctrl {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .ctrl label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .ctrl .val {
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--track);
    padding: 2px 8px;
    border-radius: 4px;
    min-width: 44px;
    text-align: right;
  }

  /* Slider */
  input[type=range] {
    grid-column: 1 / -1;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: var(--track);
    border-radius: 2px;
    outline: none;
    margin: 4px 0 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--ink);
    cursor: ew-resize;
    box-shadow: 0 0 0 1px var(--bg);
    transition: transform 0.12s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); cursor: ew-resize; border: none;
  }

  /* Segmented */
  .seg {
    grid-column: 1 / -1;
    display: flex;
    background: var(--track);
    border-radius: 6px;
    padding: 2px;
    margin-top: 4px;
  }
  .seg button {
    flex: 1;
    appearance: none; background: none; border: none;
    padding: 6px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.active {
    background: var(--ink);
    color: var(--bg);
  }

  /* Color picker row */
  .color-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .color-row label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .swatch-wrap {
    position: relative;
    width: 56px; height: 22px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
  }
  input[type=color] {
    position: absolute; inset: -2px;
    width: calc(100% + 4px); height: calc(100% + 4px);
    border: none; cursor: pointer; padding: 0;
    background: none;
  }

  /* Toggle button */
  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    background: var(--track);
    border: none;
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 8px;
    transition: background 0.15s;
  }
  .toggle:hover { background: var(--panel-hover); }
  .toggle .pill {
    width: 24px; height: 13px;
    background: var(--ink-faint);
    border-radius: 999px;
    position: relative;
    transition: background 0.2s;
  }
  .toggle .pill::after {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 9px; height: 9px;
    background: var(--bg);
    border-radius: 50%;
    transition: left 0.2s;
  }
  .toggle.on .pill { background: var(--accent); }
  .toggle.on .pill::after { left: 13px; }

  /* Hint footer */
  .hint {
    position: fixed; bottom: 18px; left: 18px;
    z-index: 10;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .hint kbd {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    background: var(--track);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    color: var(--ink-dim);
  }

  /* Palette gradient picker */
  .pal-swatches {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: 4px;
    margin-bottom: 4px;
  }
  .pal-btn {
    border: 1.5px solid transparent;
    border-radius: 6px;
    padding: 9px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .pal-btn.active {
    border-color: rgba(255,255,255,0.75);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
  }

  /* Layer gradient pickers */
  .layer-row-label {
    font-size: 9px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-faint);
    margin: 8px 0 4px;
  }
  .layer-pal {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 3px; margin-bottom: 4px;
  }
  .lpal-btn {
    border: 1.5px solid transparent; border-radius: 5px;
    padding: 7px 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 7px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    cursor: pointer; transition: border-color 0.12s;
  }
  .lpal-btn.active {
    border-color: rgba(255,255,255,0.8);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>

  <div class="topbar">
    <span class="dot"></span>
    <span><strong>Halftone</strong> &nbsp;·&nbsp; 3d visual tool</span>
  </div>

  <div class="hint">
    <kbd>drag</kbd> rotate &nbsp;·&nbsp; <kbd>scroll</kbd> zoom
  </div>

  <aside class="panel">
    <!-- SOURCE -->
    <h2>Source <span class="badge">input</span></h2>
    <div class="ctrl">
      <div class="seg" data-control="source" style="grid-column:1/-1;">
        <button data-val="0" class="active">3D Object</button>
        <button data-val="1">Video</button>
      </div>
    </div>

    <!-- GRID -->
    <h2>Grid <span class="badge">structure</span></h2>

    <div class="ctrl">
      <label>Mode</label>
      <div class="seg" data-control="mode">
        <button data-val="dots">Cells</button>
        <button data-val="cols">Cols</button>
        <button data-val="rows" class="active">Rows</button>
      </div>
    </div>

    <div class="ctrl">
      <label>Density</label><span class="val" id="v-density">120</span>
      <input type="range" id="density" min="20" max="400" step="1" value="61">
    </div>

    <div class="ctrl">
      <label>Cell Width</label><span class="val" id="v-cellw">1.00</span>
      <input type="range" id="cellw" min="0.3" max="2.5" step="0.01" value="1.4">
    </div>

    <div class="ctrl">
      <label>Cell Height</label><span class="val" id="v-cellh">1.00</span>
      <input type="range" id="cellh" min="0.3" max="2.5" step="0.01" value="1.67">
    </div>

    <div class="ctrl">
      <label>Roundness</label><span class="val" id="v-round">1.00</span>
      <input type="range" id="round" min="0" max="1" step="0.01" value="1.0">
    </div>

    <div class="ctrl">
      <label>Rotation</label><span class="val" id="v-rot">0°</span>
      <input type="range" id="rot" min="-45" max="45" step="1" value="0">
    </div>

    <div class="ctrl">
      <label>Spacing</label><span class="val" id="v-spacing">0.00</span>
      <input type="range" id="spacing" min="0" max="0.9" step="0.01" value="0.19">
    </div>

    <!-- BRIGHTNESS -->
    <h2>Brightness <span class="badge">tone curve</span></h2>

    <div class="ctrl">
      <label>Low</label><span class="val" id="v-low">0.05</span>
      <input type="range" id="low" min="0" max="0.5" step="0.01" value="0.01">
    </div>

    <div class="ctrl">
      <label>Mid</label><span class="val" id="v-mid">0.50</span>
      <input type="range" id="mid" min="0.1" max="0.9" step="0.01" value="0.49">
    </div>

    <div class="ctrl">
      <label>High</label><span class="val" id="v-high">0.95</span>
      <input type="range" id="high" min="0.5" max="1" step="0.01" value="1.0">
    </div>

    <!-- COLOR -->
    <h2>Color <span class="badge">fill</span></h2>

    <div class="ctrl">
      <div class="seg" data-control="colormode" style="grid-column: 1 / -1;">
        <button data-val="solid">Solid</button>
        <button data-val="gradient">Grad</button>
        <button data-val="palrandom">Rand</button>
        <button data-val="palluma">Luma</button>
        <button data-val="palpick" class="active">Pick</button>
        <button data-val="layers">Lay</button>
      </div>
    </div>

    <button class="toggle on" id="toggle-local-grad">
      Cell gradient <span class="pill"></span>
    </button>

    <div id="solid-controls" style="display:none;">
      <div class="color-row">
        <label>Fill</label>
        <div class="swatch-wrap"><input type="color" id="solid-color" value="#a8ff0a"></div>
      </div>
    </div>

    <div id="palette-pick-controls" style="margin-bottom:8px;">
      <div style="font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;">Palette</div>
      <div class="pal-swatches" data-control="palPick">
        <button class="pal-btn" data-val="0" style="background:linear-gradient(135deg,#645139,#5ca6cd)">Surface</button>
        <button class="pal-btn active" data-val="1" style="background:linear-gradient(135deg,#e44d43,#f9cf80)">Sunset</button>
        <button class="pal-btn" data-val="2" style="background:linear-gradient(135deg,#4e5d02,#a0b80a)">Forest</button>
        <button class="pal-btn" data-val="3" style="background:linear-gradient(135deg,#cf2f1e,#e18ea3)">Bloom</button>
      </div>
    </div>

    <div id="gradient-controls" style="display:none;">
      <div class="color-row">
        <label>Low</label>
        <div class="swatch-wrap"><input type="color" id="grad-low" value="#1a3300"></div>
      </div>
      <div class="color-row">
        <label>Mid</label>
        <div class="swatch-wrap"><input type="color" id="grad-mid" value="#86d900"></div>
      </div>
      <div class="color-row">
        <label>High</label>
        <div class="swatch-wrap"><input type="color" id="grad-high" value="#eeffba"></div>
      </div>
    </div>

    <div id="layer-controls" style="display:none;">
      <div class="layer-row-label">Blacks</div>
      <div class="layer-pal" data-layer="0">
        <button class="lpal-btn active" data-val="0" style="background:linear-gradient(135deg,#645139,#5ca6cd)">Surf</button>
        <button class="lpal-btn" data-val="1" style="background:linear-gradient(135deg,#e44d43,#f9cf80)">Sun</button>
        <button class="lpal-btn" data-val="2" style="background:linear-gradient(135deg,#4e5d02,#a0b80a)">Fore</button>
        <button class="lpal-btn" data-val="3" style="background:linear-gradient(135deg,#cf2f1e,#e18ea3)">Blm</button>
      </div>
      <div class="ctrl">
        <label>Threshold</label><span class="val" id="v-layert1">0.12</span>
        <input type="range" id="layert1" min="0.01" max="0.96" step="0.01" value="0.12">
      </div>
      <div class="layer-row-label">Dark</div>
      <div class="layer-pal" data-layer="1">
        <button class="lpal-btn active" data-val="0" style="background:linear-gradient(135deg,#645139,#5ca6cd)">Surf</button>
        <button class="lpal-btn" data-val="1" style="background:linear-gradient(135deg,#e44d43,#f9cf80)">Sun</button>
        <button class="lpal-btn" data-val="2" style="background:linear-gradient(135deg,#4e5d02,#a0b80a)">Fore</button>
        <button class="lpal-btn" data-val="3" style="background:linear-gradient(135deg,#cf2f1e,#e18ea3)">Blm</button>
      </div>
      <div class="ctrl">
        <label>Threshold</label><span class="val" id="v-layert2">0.25</span>
        <input type="range" id="layert2" min="0.02" max="0.97" step="0.01" value="0.25">
      </div>
      <div class="layer-row-label">Mid</div>
      <div class="layer-pal" data-layer="2">
        <button class="lpal-btn" data-val="0" style="background:linear-gradient(135deg,#645139,#5ca6cd)">Surf</button>
        <button class="lpal-btn" data-val="1" style="background:linear-gradient(135deg,#e44d43,#f9cf80)">Sun</button>
        <button class="lpal-btn active" data-val="2" style="background:linear-gradient(135deg,#4e5d02,#a0b80a)">Fore</button>
        <button class="lpal-btn" data-val="3" style="background:linear-gradient(135deg,#cf2f1e,#e18ea3)">Blm</button>
      </div>
      <div class="ctrl">
        <label>Threshold</label><span class="val" id="v-layert3">0.50</span>
        <input type="range" id="layert3" min="0.03" max="0.98" step="0.01" value="0.5">
      </div>
      <div class="layer-row-label">Mid-light</div>
      <div class="layer-pal" data-layer="3">
        <button class="lpal-btn" data-val="0" style="background:linear-gradient(135deg,#645139,#5ca6cd)">Surf</button>
        <button class="lpal-btn active" data-val="1" style="background:linear-gradient(135deg,#e44d43,#f9cf80)">Sun</button>
        <button class="lpal-btn" data-val="2" style="background:linear-gradient(135deg,#4e5d02,#a0b80a)">Fore</button>
        <button class="lpal-btn" data-val="3" style="background:linear-gradient(135deg,#cf2f1e,#e18ea3)">Blm</button>
      </div>
      <div class="ctrl">
        <label>Threshold</label><span class="val" id="v-layert4">0.75</span>
        <input type="range" id="layert4" min="0.04" max="0.99" step="0.01" value="0.75">
      </div>
      <div class="layer-row-label">Light</div>
      <div class="layer-pal" data-layer="4">
        <button class="lpal-btn" data-val="0" style="background:linear-gradient(135deg,#645139,#5ca6cd)">Surf</button>
        <button class="lpal-btn" data-val="1" style="background:linear-gradient(135deg,#e44d43,#f9cf80)">Sun</button>
        <button class="lpal-btn" data-val="2" style="background:linear-gradient(135deg,#4e5d02,#a0b80a)">Fore</button>
        <button class="lpal-btn active" data-val="3" style="background:linear-gradient(135deg,#cf2f1e,#e18ea3)">Blm</button>
      </div>
    </div>

    <div class="color-row" style="margin-top:6px;">
      <label>Background</label>
      <div class="swatch-wrap"><input type="color" id="bg-color" value="#f5f1ea"></div>
    </div>

    <!-- OBJECT -->
    <h2>Object <span class="badge">3d source</span></h2>

    <div id="source-3d-ui">
      <div class="ctrl">
        <label>FOV</label><span class="val" id="v-fov">35°</span>
        <input type="range" id="fov" min="10" max="90" step="1" value="10">
      </div>

      <div class="ctrl">
        <label>Shading</label>
        <div class="seg" data-control="shading">
          <button data-val="flat">Silhouette</button>
          <button data-val="lit" class="active">Lit</button>
        </div>
      </div>

      <button class="toggle" id="toggle-size-brt">
        Size ← Brightness <span class="pill"></span>
      </button>

      <button class="toggle on" id="toggle-spin">
        Auto-spin <span class="pill"></span>
      </button>

      <div class="ctrl">
        <label>Spin Speed</label><span class="val" id="v-spin">0.30</span>
        <input type="range" id="spin" min="0" max="2" step="0.01" value="0.3">
      </div>
    </div>
  </aside>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// STATE — single source of truth, wired to UI
// ============================================================
const state = {
  mode: 2,            // 0=cells, 1=cols, 2=rows
  density: 61,
  cellW: 1.4,
  cellH: 1.67,
  round: 1.0,
  rot: 0,
  spacing: 0.19,
  fov: 10,
  sizeFromBrt: false,
  low: 0.01,
  mid: 0.49,
  high: 1.0,
  source: 0,          // 0=3d, 1=video
  colorMode: 4,       // 0=solid, 1=gradient, 2=palrandom, 3=palluma, 4=palpick, 5=layers
  solid: [0.66, 1.0, 0.04],
  gLow:  [0.10, 0.20, 0.0],
  gMid:  [0.53, 0.85, 0.0],
  gHigh: [0.93, 1.0, 0.73],
  bg:    [0.961, 0.945, 0.918],
  shading: 1,         // 0=flat, 1=lit
  spinOn: true,
  spinSpeed: 0.3,
  localGrad: true,   // true = gradient within each cell; false = sweeps full screen
  palPick: 1,
  layerGrad: [0, 0, 2, 1, 3],  // 5 layers: Blacks=Surface, Dark=Surface, Mid=Forest, Mid-light=Sunset, Light=Bloom
  layerT1: 0.12,   // Blacks / Dark threshold
  layerT2: 0.25,   // Dark / Mid threshold
  layerT3: 0.50,   // Mid / Mid-light threshold
  layerT4: 0.75,   // Mid-light / Light threshold
};

// ============================================================
// THREE.JS SETUP
// ============================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
camera.position.set(0, 0, 200);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 50;
controls.maxDistance = 1000;
controls.target.set(0, 0, 0);

// Lighting — for the lit mode
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(2, 3, 4);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
rimLight.position.set(-3, 1, -2);
scene.add(ambient, keyLight, rimLight);

// Model group — lets us spin without affecting camera target
const modelGroup = new THREE.Group();
scene.add(modelGroup);

// Two materials: flat (silhouette) and lit. We swap on all loaded meshes.
const flatMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
const litMaterial  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.0 });

let loadedRoot = null;
const meshObjects = [];

new GLTFLoader().load(
  './model.gltf',
  (gltf) => {
    const root = gltf.scene;
    root.traverse((obj) => {
      if (obj.isMesh) {
        obj.material = state.shading === 0 ? flatMaterial : litMaterial;
        meshObjects.push(obj);
      } else if (obj.isLine || obj.isLineSegments || obj.isLineLoop) {
        obj.visible = false;
      }
    });
    if (meshObjects.length) {
      modelGroup.add(root);
      loadedRoot = root;
      frameModel();
    }
  },
  undefined,
  (err) => console.error('GLTF load error', err)
);

function frameModel() {
  if (!loadedRoot) return;
  const box = new THREE.Box3().setFromObject(modelGroup);
  const size   = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  loadedRoot.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov    = camera.fov * (Math.PI / 180);
  const dist   = (maxDim * 0.6) / Math.tan(fov / 2);
  camera.position.set(0, 0, dist * 1.25);
  controls.target.set(0, 0, 0);
  controls.update();
}

// ============================================================
// RENDER TARGET — NearestFilter avoids edge-blending artefacts
// ============================================================
const sceneTarget = new THREE.WebGLRenderTarget(2, 2, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  type: THREE.UnsignedByteType,
});

// ============================================================
// VIDEO SOURCE
// ============================================================
const video = Object.assign(document.createElement('video'), {
  src: './mp_.mp4', muted: true, loop: true, playsInline: true, crossOrigin: 'anonymous',
});
video.play().catch(() => {});

const videoTexture = new THREE.VideoTexture(video);
videoTexture.minFilter = THREE.LinearFilter;
videoTexture.magFilter = THREE.LinearFilter;

let videoAspect = 16 / 9;
video.addEventListener('loadedmetadata', () => {
  videoAspect = video.videoWidth / video.videoHeight;
  videoPassMat.uniforms.uVideoAspect.value = videoAspect;
  if (state.source === 1) resize(); // re-fit canvas to real video dims
});

const videoPassMat = new THREE.ShaderMaterial({
  uniforms: {
    uVideoTex:    { value: videoTexture },
    uVideoAspect: { value: 16 / 9 },
    uViewAspect:  { value: 1.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uVideoTex;
    uniform float uVideoAspect;
    uniform float uViewAspect;
    void main() {
      vec2 uv = vUv;
      if (uVideoAspect > uViewAspect) {
        uv.x = (uv.x - 0.5) / (uViewAspect / uVideoAspect) + 0.5;
      } else {
        uv.y = (uv.y - 0.5) / (uVideoAspect / uViewAspect) + 0.5;
      }
      uv = clamp(uv, 0.0, 1.0);
      gl_FragColor = vec4(texture2D(uVideoTex, uv).rgb, 1.0);
    }
  `,
});
const videoScene = new THREE.Scene();
videoScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), videoPassMat));

// ============================================================
// HALFTONE PASS
// ============================================================
const quadScene = new THREE.Scene();
const quadCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const halftoneMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTex:         { value: sceneTarget.texture },
    uResolution:  { value: new THREE.Vector2(1, 1) },
    uMode:        { value: 0 },
    uDensity:     { value: 120.0 },
    uCellW:       { value: 1.0 },
    uCellH:       { value: 1.0 },
    uRound:       { value: 1.0 },
    uRot:         { value: 0.0 },
    uLow:         { value: 0.05 },
    uMid:         { value: 0.5 },
    uHigh:        { value: 0.95 },
    uSpacing:     { value: 0.0 },
    uSizeFromBrt: { value: 1 },
    uColorMode:   { value: 0 },
    uSolid:       { value: new THREE.Vector3(0.66, 1.0, 0.04) },
    uGLow:        { value: new THREE.Vector3(0.10, 0.20, 0.0) },
    uGMid:        { value: new THREE.Vector3(0.53, 0.85, 0.0) },
    uGHigh:       { value: new THREE.Vector3(0.93, 1.0, 0.73) },
    uBg:          { value: new THREE.Vector3(0, 0, 0) },
    uPal0A:       { value: new THREE.Vector3(0.392, 0.318, 0.224) },
    uPal0B:       { value: new THREE.Vector3(0.361, 0.651, 0.804) },
    uPal1A:       { value: new THREE.Vector3(0.894, 0.302, 0.263) },
    uPal1B:       { value: new THREE.Vector3(0.976, 0.812, 0.502) },
    uPal2A:       { value: new THREE.Vector3(0.306, 0.365, 0.008) },
    uPal2B:       { value: new THREE.Vector3(0.627, 0.722, 0.039) },
    uPal3A:       { value: new THREE.Vector3(0.812, 0.184, 0.118) },
    uPal3B:       { value: new THREE.Vector3(0.882, 0.557, 0.639) },
    uLocalGrad:   { value: 1 },
    uPalPick:     { value: 0 },
    uLayerGrad0:  { value: 0 },
    uLayerGrad1:  { value: 0 },
    uLayerGrad2:  { value: 2 },
    uLayerGrad3:  { value: 1 },
    uLayerGrad4:  { value: 3 },
    uLayerT1:     { value: 0.12 },
    uLayerT2:     { value: 0.25 },
    uLayerT3:     { value: 0.50 },
    uLayerT4:     { value: 0.75 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform vec2 uResolution;

    uniform int   uMode;
    uniform float uDensity;
    uniform float uCellW;
    uniform float uCellH;
    uniform float uRound;
    uniform float uRot;

    uniform float uLow;
    uniform float uMid;
    uniform float uHigh;

    uniform float uSpacing;
    uniform int   uSizeFromBrt;

    uniform int   uColorMode;
    uniform vec3  uSolid;
    uniform vec3  uGLow;
    uniform vec3  uGMid;
    uniform vec3  uGHigh;
    uniform vec3  uBg;

    uniform vec3  uPal0A; uniform vec3 uPal0B;
    uniform vec3  uPal1A; uniform vec3 uPal1B;
    uniform vec3  uPal2A; uniform vec3 uPal2B;
    uniform vec3  uPal3A; uniform vec3 uPal3B;
    uniform int   uLocalGrad;
    uniform int   uPalPick;

    uniform int   uLayerGrad0;
    uniform int   uLayerGrad1;
    uniform int   uLayerGrad2;
    uniform int   uLayerGrad3;
    uniform int   uLayerGrad4;
    uniform float uLayerT1;
    uniform float uLayerT2;
    uniform float uLayerT3;
    uniform float uLayerT4;

    float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

    float toneCurve(float l) {
      l = clamp(l, 0.0, 1.0);
      if (l <= uLow)  return 0.0;
      if (l >= uHigh) return 1.0;
      if (l < uMid) return (l - uLow) / max(uMid - uLow, 1e-4) * 0.5;
      return 0.5 + (l - uMid) / max(uHigh - uMid, 1e-4) * 0.5;
    }

    vec3 sampleGradient(float t) {
      t = clamp(t, 0.0, 1.0);
      if (t < 0.5) return mix(uGLow, uGMid, t * 2.0);
      return mix(uGMid, uGHigh, (t - 0.5) * 2.0);
    }

    vec3 palColor(int gi, float t) {
      t = clamp(t, 0.0, 1.0);
      if (gi == 0) return mix(uPal0A, uPal0B, t);
      if (gi == 1) return mix(uPal1A, uPal1B, t);
      if (gi == 2) return mix(uPal2A, uPal2B, t);
      return mix(uPal3A, uPal3B, t);
    }

    // Signed-distance rounded box centred at origin; hext = half-extents
    float sdRoundBox(vec2 p, vec2 hext, float r) {
      r = min(r, min(hext.x, hext.y));
      vec2 q = abs(p) - (hext - vec2(r));
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
    }

    void main() {
      // Grid in pixel space, with optional rotation
      vec2 pix    = vUv * uResolution;
      vec2 center = uResolution * 0.5;
      vec2 p      = pix - center;
      float c = cos(uRot), s = sin(uRot);
      p = mat2(c, -s, s, c) * p;
      p += center;

      float baseCell = min(uResolution.x, uResolution.y) / uDensity;
      vec2 cellSize  = vec2(baseCell * uCellW, baseCell * uCellH);

      vec2 cellIdx      = floor(p / cellSize);
      vec2 cellCenterPix = (cellIdx + 0.5) * cellSize;

      // Rotate cell centre back to sample the texture
      vec2 q2    = cellCenterPix - center;
      vec2 qBack = mat2(c, s, -s, c) * q2;
      vec2 sampleUv = (qBack + center) / uResolution;

      vec3 bg = uBg;
      if (sampleUv.x < 0.0 || sampleUv.x > 1.0 ||
          sampleUv.y < 0.0 || sampleUv.y > 1.0) {
        gl_FragColor = vec4(bg, 1.0); return;
      }

      vec4  tex = texture2D(uTex, sampleUv);
      float l   = luma(tex.rgb) * tex.a;   // alpha=0 outside model → l=0
      float t   = toneCurve(l);

      // Early-exit: avoids SDF-centre artefact (mask=0.5) at t≈0
      if (t < 0.01) { gl_FragColor = vec4(bg, 1.0); return; }

      // Decouple size from colour: when off, every cell is drawn at full size
      float tSize = (uSizeFromBrt == 1) ? t : 1.0;

      vec2  local = p - cellCenterPix;
      float gap   = 1.0 - uSpacing;

      // Palette gradient direction: local (within each cell/bar) or global (full screen)
      float cellLocalT;
      if (uLocalGrad == 1) {
        // Local: gradient maps within each cell or bar's own bounds
        if (uMode == 0) {
          vec2 hF = cellSize * 0.5 * gap * tSize;
          cellLocalT = clamp(local.y / max(hF.y, 0.001) * 0.5 + 0.5, 0.0, 1.0);
        } else if (uMode == 1) {
          // COLS bar: gradient goes left→right across bar width
          float hw = cellSize.x * 0.5 * gap * tSize;
          cellLocalT = clamp(local.x / max(hw, 0.001) * 0.5 + 0.5, 0.0, 1.0);
        } else {
          // ROWS bar: gradient goes top→bottom across bar height
          float hh = cellSize.y * 0.5 * gap * tSize;
          cellLocalT = clamp(local.y / max(hh, 0.001) * 0.5 + 0.5, 0.0, 1.0);
        }
      } else {
        // Global: gradient sweeps across the full canvas
        if (uMode == 1) {
          cellLocalT = clamp(pix.y / uResolution.y, 0.0, 1.0);
        } else if (uMode == 2) {
          cellLocalT = clamp(pix.x / uResolution.x, 0.0, 1.0);
        } else {
          cellLocalT = clamp(pix.y / uResolution.y, 0.0, 1.0);
        }
      }

      float mask  = 0.0;

      if (uMode == 0) {
        // CELLS — both axes scale with brightness
        vec2  hext = cellSize * 0.5 * gap * tSize;
        float r    = uRound * min(hext.x, hext.y);
        float d    = sdRoundBox(local, hext, r);
        float aa   = max(fwidth(d), 0.5);
        mask = 1.0 - smoothstep(-aa, aa, d);
      } else if (uMode == 1) {
        // COLS — continuous vertical bars; only X is clipped, width scales with brightness
        float hw = cellSize.x * 0.5 * gap * tSize;
        float d  = abs(local.x) - hw;
        float aa = max(fwidth(d), 0.5);
        mask = 1.0 - smoothstep(-aa, aa, d);
      } else {
        // ROWS — continuous horizontal bars; only Y is clipped, height scales with brightness
        float hh = cellSize.y * 0.5 * gap * tSize;
        float d  = abs(local.y) - hh;
        float aa = max(fwidth(d), 0.5);
        mask = 1.0 - smoothstep(-aa, aa, d);
      }

      vec3 fillColor;
      if (uColorMode == 0) {
        fillColor = uSolid;
      } else if (uColorMode == 1) {
        fillColor = sampleGradient(t);
      } else if (uColorMode == 2) {
        // Random gradient per cell (stable hash)
        float hh = fract(sin(dot(cellIdx, vec2(127.1, 311.7))) * 43758.5453);
        int gi = int(min(floor(hh * 4.0), 3.0));
        fillColor = palColor(gi, cellLocalT);
      } else if (uColorMode == 3) {
        // Gradient chosen by brightness, fill spans cell
        int gi = int(min(floor(t * 4.0), 3.0));
        fillColor = palColor(gi, cellLocalT);
      } else if (uColorMode == 4) {
        // Solid color sampled from user-picked gradient via brightness
        fillColor = palColor(uPalPick, t);
      } else {
        // LAYERS — 4 luminance bands, each using a palette gradient
        int lg;
        if (t < uLayerT1)      lg = uLayerGrad0;
        else if (t < uLayerT2) lg = uLayerGrad1;
        else if (t < uLayerT3) lg = uLayerGrad2;
        else if (t < uLayerT4) lg = uLayerGrad3;
        else                   lg = uLayerGrad4;
        fillColor = palColor(lg, cellLocalT);
      }
      gl_FragColor = vec4(mix(bg, fillColor, mask), 1.0);
    }
  `,
});

quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), halftoneMaterial));

// ============================================================
// RESIZE
// ============================================================
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = renderer.getPixelRatio();
  const stage = document.getElementById('stage');

  let w, h;
  if (state.source === 1) {
    // Constrain canvas to the video's native aspect ratio (letterbox / pillarbox)
    if (vw / vh > videoAspect) {
      // viewport wider than video → pillarbox (black bars on sides)
      h = vh;
      w = Math.round(h * videoAspect);
    } else {
      // viewport taller than video → letterbox (black bars top/bottom)
      w = vw;
      h = Math.round(w / videoAspect);
    }
    const top  = Math.round((vh - h) / 2);
    const left = Math.round((vw - w) / 2);
    stage.style.cssText = `position:fixed;width:${w}px;height:${h}px;top:${top}px;left:${left}px;`;
  } else {
    w = vw; h = vh;
    stage.style.cssText = 'position:fixed;inset:0;';
  }

  renderer.setSize(w, h, false);
  sceneTarget.setSize(Math.floor(w * dpr), Math.floor(h * dpr));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  halftoneMaterial.uniforms.uResolution.value.set(Math.floor(w * dpr), Math.floor(h * dpr));
  videoPassMat.uniforms.uViewAspect.value = w / h;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// MAIN LOOP
// ============================================================
const clock = new THREE.Clock();

function render() {
  const dt = clock.getDelta();

  if (state.source === 0) {
    if (state.spinOn && loadedRoot) modelGroup.rotation.y += dt * state.spinSpeed;
    controls.update();
  }

  // Pass 1 — fill sceneTarget from active source
  renderer.setRenderTarget(sceneTarget);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  if (state.source === 0) {
    renderer.render(scene, camera);           // 3D object
  } else {
    renderer.render(videoScene, quadCam);     // video passthrough
  }

  // Pass 2 — halftone quad → screen
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCam);

  requestAnimationFrame(render);
}
render();

// ============================================================
// UI WIRING
// ============================================================
function hexToRgb(hex) {
  const m = hex.replace('#', '');
  return [parseInt(m.slice(0,2),16)/255, parseInt(m.slice(2,4),16)/255, parseInt(m.slice(4,6),16)/255];
}

function syncUniforms() {
  const u = halftoneMaterial.uniforms;
  u.uMode.value        = state.mode;
  u.uDensity.value     = state.density;
  u.uCellW.value       = state.cellW;
  u.uCellH.value       = state.cellH;
  u.uRound.value       = state.round;
  u.uRot.value         = state.rot * Math.PI / 180;
  u.uSpacing.value     = state.spacing;
  u.uSizeFromBrt.value = state.sizeFromBrt ? 1 : 0;
  u.uLow.value         = state.low;
  u.uMid.value         = state.mid;
  u.uHigh.value        = state.high;
  u.uColorMode.value   = state.colorMode;
  u.uSolid.value.fromArray(state.solid);
  u.uGLow.value.fromArray(state.gLow);
  u.uGMid.value.fromArray(state.gMid);
  u.uGHigh.value.fromArray(state.gHigh);
  u.uBg.value.fromArray(state.bg);
  u.uLocalGrad.value = state.localGrad ? 1 : 0;
  u.uPalPick.value = state.palPick;
  u.uLayerGrad0.value = state.layerGrad[0];
  u.uLayerGrad1.value = state.layerGrad[1];
  u.uLayerGrad2.value = state.layerGrad[2];
  u.uLayerGrad3.value = state.layerGrad[3];
  u.uLayerGrad4.value = state.layerGrad[4];
  u.uLayerT1.value = state.layerT1;
  u.uLayerT2.value = state.layerT2;
  u.uLayerT3.value = state.layerT3;
  u.uLayerT4.value = state.layerT4;
}

function bindSlider(id, key, fmt = v => v.toFixed(2), parse = parseFloat, valKey = id) {
  const el  = document.getElementById(id);
  const val = document.getElementById('v-' + valKey);
  const apply = () => {
    state[key] = parse(el.value);
    if (val) val.textContent = fmt(state[key]);
    syncUniforms();
  };
  el.addEventListener('input', apply);
  apply();
}

function bindSegmented(name, key, parse = v => v) {
  const wrap = document.querySelector(`.seg[data-control="${name}"]`);
  if (!wrap) return;
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    wrap.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state[key] = parse(btn.dataset.val);
    if (key === 'colorMode') {
      document.getElementById('solid-controls').style.display        = state.colorMode === 0 ? '' : 'none';
      document.getElementById('gradient-controls').style.display     = state.colorMode === 1 ? '' : 'none';
      document.getElementById('palette-pick-controls').style.display = state.colorMode === 4 ? '' : 'none';
      document.getElementById('layer-controls').style.display        = state.colorMode === 5 ? '' : 'none';
    }
    if (key === 'shading') {
      const mat = state.shading === 0 ? flatMaterial : litMaterial;
      meshObjects.forEach(m => { m.material = mat; });
    }
    syncUniforms();
  });
}

function bindColor(id, key) {
  const el = document.getElementById(id);
  const apply = () => { state[key] = hexToRgb(el.value); syncUniforms(); };
  el.addEventListener('input', apply);
  apply();
}

bindSlider('cellw',   'cellW',   v => v.toFixed(2), parseFloat, 'cellw');

// Palette picker
(function() {
  const wrap = document.querySelector('.pal-swatches[data-control="palPick"]');
  if (!wrap) return;
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.pal-btn');
    if (!btn) return;
    wrap.querySelectorAll('.pal-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.palPick = parseInt(btn.dataset.val);
    syncUniforms();
  });
})();
</script>
</body>
</html>
